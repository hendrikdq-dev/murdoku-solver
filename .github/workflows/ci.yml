name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint y formato
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm run lint && npm run format:check
      - name: Tests
        run: npm test
      - name: Cobertura (umbral de líneas 85 %)
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: node --test --experimental-test-coverage --test-coverage-lines=85
